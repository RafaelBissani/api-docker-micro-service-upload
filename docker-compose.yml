version: '3.8'

services:
  api-upload:
    container_name: api_micro_service_upload_production_orders_harpiasystem # Nome personalizado do container
    build:
      context: . # Utiliza o Dockerfile da raiz do projeto
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    volumes:
      - ./uploads:/app/uploads # Mapeia a pasta local ./uploads para /app/uploads no container
    environment:
      UPLOAD_PUBLIC_URL: http://api_micro_service_upload_production_orders_harpiasystem:3333
    networks:
      - harpia-network # Adiciona a rede para comunicação

networks:
  harpia-network:
    external: true
